{% extends "base.html" %}

{% block title %}Recuperar senha - Banco de Especialistas IFG{% endblock %}

{% block content %}
<section class="auth-panel">
    <a class="back-link" href="{% url 'login' %}">← voltar</a>
    <h1>Recuperar senha</h1>
    <p>Informe o e-mail cadastrado. Em desenvolvimento, o link aparece no console do Django.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-button">Enviar instruções</button>
    </form>
</section>
{% endblock %}
