{% extends "base_dashboard.html" %}
{% load static %}

{% block title %}Início - Banco de Talentos IFG{% endblock %}

{% block page_content %}
<div style="padding:32px 32px 0">
    <h2 style="margin:0 0 4px;color:#202124">
        Olá, {{ request.user.nome_completo|truncatewords:1|cut:" …" }}!
    </h2>
    <p style="color:#666;margin:0 0 20px;font-size:14px">
        Modalidade: <strong>{{ request.user.get_vinculo_display }}</strong>
    </p>
</div>

<img src="{% static 'imagens/home.png' %}"
     alt="Banco de Talentos IFG"
     style="width:100%;display:block">
{% endblock %}
